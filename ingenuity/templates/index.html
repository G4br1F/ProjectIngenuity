{% extends "base.html" %}

{% block content %}

<div class="container-fluid py-3">

    <!-- Header -->
    <div class="row mb-3">
        <div class="col">

            <div class="card bg-dark border-secondary">

                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h3 class="m-0">🤖 Project Ingenuity</h3>
                        <small id="hostname">--</small>
                    </div>

                    <div class="text-end">
                        <span id="robot-status" class="badge bg-success">
                            ONLINE
                        </span>
                        <br>
                        <small id="ip">--</small>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <div class="row">

        <!-- Webcam -->
        <div class="col-xl-8 mb-3">

            <div class="card bg-dark border-secondary h-100">

                <div class="card-header">
                    📷 Webcam
                </div>

                <div class="card-body text-center">

                    <img
                        id="camera-stream"
                        src="/video_feed"
                        class="img-fluid rounded shadow"
                        alt="Webcam">

                </div>

            </div>

        </div>

        <!-- Telemetria -->
        <div class="col-xl-4">

            <div class="card bg-dark border-secondary">

                <div class="card-header">
                    📊 Telemetria
                </div>

                <div class="card-body">

                    <!-- CPU -->
                    <div class="metric">
                        <div class="d-flex justify-content-between">
                            <span>CPU</span>
                            <span id="cpu">--%</span>
                        </div>

                        <div class="progress">
                            <div id="cpu-bar"
                                 class="progress-bar"
                                 style="width:0%">
                            </div>
                        </div>
                    </div>

                    <!-- RAM -->
                    <div class="metric">

                        <div class="d-flex justify-content-between">
                            <span>RAM</span>
                            <span id="ram">--%</span>
                        </div>

                        <div class="progress">
                            <div id="ram-bar"
                                 class="progress-bar bg-success"
                                 style="width:0%">
                            </div>
                        </div>

                    </div>

                    <!-- Disco -->
                    <div class="metric">

                        <div class="d-flex justify-content-between">
                            <span>Disco</span>
                            <span id="disk">--%</span>
                        </div>

                        <div class="progress">
                            <div id="disk-bar"
                                 class="progress-bar bg-warning"
                                 style="width:0%">
                            </div>
                        </div>

                    </div>

                    <!-- Temperatura -->
                    <div class="metric">

                        <div class="d-flex justify-content-between">
                            <span>Temperatura</span>
                            <span id="temperature">--°C</span>
                        </div>

                        <div class="progress">
                            <div id="temp-bar"
                                 class="progress-bar bg-danger"
                                 style="width:0%">
                            </div>
                        </div>

                    </div>

                    <hr>

                    <div class="info-row">
                        <span>Camera</span>
                        <span id="camera">--</span>
                    </div>

                    <div class="info-row">
                        <span>Uptime</span>
                        <span id="uptime">--</span>
                    </div>

                    <div class="info-row">
                        <span>YOLO</span>
                        <span id="yolo">0 oggetti</span>
                    </div>

                    <div class="info-row">
                        <span>FPS</span>
                        <span id="fps">--</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Log -->
    <div class="row mt-3">

        <div class="col">

            <div class="card bg-dark border-secondary">

                <div class="card-header">
                    📝 Log di sistema
                </div>

                <div class="card-body">

                    <div id="system-log">
                        Dashboard avviata...
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
