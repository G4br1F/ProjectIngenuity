<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robot OS - Login</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="robot-icon">
                🤖
            </div>

            <h1>Robot OS</h1>

            <p class="subtitle">
                Accesso al sistema
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/login">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit">
                    Accedi
                </button>

            </form>

        </section>

    </main>

</body>

</html>
